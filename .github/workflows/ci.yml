name: ci

on:
  push:
  pull_request:

jobs:
  build-test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: gcc-debug
            cc: gcc
            cxx: g++
            flags: -DCMAKE_BUILD_TYPE=Debug
          - name: gcc-release
            cc: gcc
            cxx: g++
            flags: -DCMAKE_BUILD_TYPE=Release
          - name: clang-asan-ubsan
            cc: clang
            cxx: clang++
            flags: -DCMAKE_BUILD_TYPE=RelWithDebInfo -DEMBER_ASAN=ON -DEMBER_UBSAN=ON
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Layering check
        run: ./scripts/check_layering.sh
      - name: Configure
        run: CC=${{ matrix.cc }} CXX=${{ matrix.cxx }} cmake -S . -B build -G Ninja ${{ matrix.flags }}
      - name: Build
        run: cmake --build build
      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir build --output-on-failure
      - name: Extended differential test
        if: matrix.name == 'gcc-release'
        run: ./build/tests/difftest --seeds 3000 --start 100000
      - name: Formatter check on examples
        if: matrix.name == 'gcc-release'
        run: for f in examples/*.em; do ./build/ember fmt --check "$f"; done

  fuzz-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang libclang-rt-18-dev
      - name: Build fuzzers
        run: |
          CC=clang CXX=clang++ cmake -S . -B build-fuzz -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DEMBER_FUZZ=ON -DEMBER_ASAN=ON -DEMBER_UBSAN=ON
          cmake --build build-fuzz
      - name: Run each fuzzer for 60 seconds
        run: |
          for t in fuzz_lexer fuzz_compile fuzz_run fuzz_bytecode fuzz_mutate_bytecode; do
            mkdir -p corpus-$t
            cp fuzz/corpus/compile/*.em corpus-$t/ 2>/dev/null || true
            ./build-fuzz/fuzz/$t -max_total_time=60 -timeout=10 -dict=fuzz/ember.dict corpus-$t
          done

  benchmarks-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Build
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release && cmake --build build
      - name: Benchmarks run and produce the expected output (timings are not compared in CI)
        run: python3 bench/run.py --ember build/ember --runs 1 --check-only
